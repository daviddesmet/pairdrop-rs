services:
  pairdrop:
    build: .
    image: pairdrop-rs:latest
    container_name: pairdrop
    restart: unless-stopped
    environment:
      - WS_FALLBACK=false # Set to true to relay transfers through the server when WebRTC is unavailable.
      - RATE_LIMIT=false # Set to true to limit clients to 1000 requests per 5 min.
      - RTC_CONFIG=false # Set to the path of a file that specifies the STUN/TURN servers.
      - DEBUG_MODE=false # Set to true to debug container and peer connections.
      - TRUST_CF_CONNECTING_IP=false # Set to true only when Cloudflare is the sole way in.
      - TZ=Etc/UTC # Time Zone
    ports:
      - "127.0.0.1:3000:3000" # Keep this on loopback so clients cannot bypass the reverse proxy.
