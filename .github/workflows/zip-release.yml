# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

# Create a new zip file from pairdrop-cli whenever a new version tag is pushed

name: Zip Release

on:
  # Publishing a release fires `push` for the tag it creates, so this covers both routes.
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: zip-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Archive Release
        uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # v0.7.6
        with:
          filename: 'pairdrop-cli.zip'
          directory: 'pairdrop-cli'
          exclusions: '*.git* /*node_modules/* .editorconfig'
      # The release is published first, which is what creates the tag that triggers this, so the
      # release always exists by the time we get here. Attach to it rather than creating it, and
      # leave its title and notes alone.
      - name: Upload Release
        uses: ncipollo/release-action@6c75be85e571768fa31b40abf38de58ba0397db5 # v1.13.0
        with:
          artifacts: "pairdrop-cli/pairdrop-cli.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true